services:
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    # 公网部署时 redis 绝不能暴露宿主机端口——无密码的 Redis
    # 是被扫描爆破（挂矿）的重灾区。前后端都走容器网络访问。
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: agent-mysql
    restart: unless-stopped
    # 公网部署时 MySQL 同样只走容器网络，不暴露宿主机端口
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: agent
      # 密码从 .env 读取，绝不写进仓库。
      # 注意用 :- 而非 :?：CI 环境没有 .env，:? 会让 compose config 校验失败；
      # 真实启动时密码为空会被官方 mysql 镜像直接拒绝（必须显式
      # MYSQL_ALLOW_EMPTY_PASSWORD 才允许），误配置仍会明确失败而不是裸奔。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      TZ: Asia/Shanghai
    # 与本地建库保持一致的字符集，避免中文与 emoji 写入报错
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      # MySQL 首次初始化较慢，给足启动宽限
      start_period: 30s

  backend:
    build: .
    container_name: agent-backend
    restart: unless-stopped
    # 只绑定本机回环：外部流量一律经 frontend 的 nginx 反代 /api，
    # 直连 8000 会绕过前端的体积限制与缓存层
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问 Redis / MySQL，覆盖 .env 里的 localhost
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/agent?charset=utf8mb4
      # compose 暴露的前端端口是 8080
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      # 容器默认 UTC，"现在几点"和埋点的"今日"分桶都需要本地时区
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      # 上传文件与知识库要持久化：否则容器重建之后，
      # 上传的文件消失，文档问答会退化成"知识库里没有"
      - ./uploads:/app/uploads
      - ./rag_store:/app/rag_store
      # 评测报告：宿主机新跑的评测，看板无需重建镜像即可看到
      - ./evals/reports:/app/evals/reports

  frontend:
    build: ./frontend
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      # 本地开发默认 8080（避开 vite 的 5173）；
      # 云服务器上在 .env 设 FRONTEND_PORT=80 直接监听 80 端口
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  redis_data:
  mysql_data:
